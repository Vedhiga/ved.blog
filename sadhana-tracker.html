<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadhana + Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --white:#fff; --silver:#f0f0f0; --lgray:#d8d8d8; --mgray:#999; --dgray:#444;
    --black:#111; --yellow:#f5d700; --ybg:#fffbe6;
    --blue:#2563eb; --lblue:#dbeafe;
    --pink:#e91e8c; --lpink:#fce7f3; --mpink:#f9a8d4;
    --green:#16a34a; --lgreen:#dcfce7;
    --font-serif:'DM Serif Display',Georgia,serif;
    --font-sans:'Inter',sans-serif;
    --font-mono:'DM Mono',monospace;
    --radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--silver);color:var(--black);font-size:14px;padding:1.2rem}

  h2{font-family:var(--font-serif);font-size:1.3rem;margin-bottom:0.8rem}
  .mono{font-family:var(--font-mono);font-size:0.75rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--mgray)}

  /* ─ DATE BANNER ─ */
  .date-banner{
    background:var(--black);color:var(--yellow);
    font-family:var(--font-mono);font-size:0.8rem;letter-spacing:0.1em;
    padding:8px 14px;border-radius:var(--radius);margin-bottom:1rem;
    display:flex;align-items:center;justify-content:space-between;
  }

  /* ─ GRID LAYOUT ─ */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}

  /* ─ CARD ─ */
  .card{background:var(--white);border:1px solid var(--lgray);border-radius:var(--radius);padding:1.1rem}

  /* ─ SADHANA ITEMS ─ */
  .sadhana-list{display:flex;flex-direction:column;gap:8px;margin-top:0.7rem}
  .sadhana-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:8px;border:1px solid var(--lgray);
    cursor:pointer;transition:background 0.15s;user-select:none;
  }
  .sadhana-item:hover{background:var(--silver)}
  .sadhana-item.done{background:var(--lgreen);border-color:#86efac}
  .sadhana-item.done .s-label{text-decoration:line-through;color:var(--mgray)}
  .s-check{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--lgray);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-size:11px;transition:all 0.15s;
  }
  .sadhana-item.done .s-check{background:var(--green);border-color:var(--green);color:#fff}
  .s-label{font-size:0.83rem;font-weight:500;flex:1}
  .s-rounds{font-family:var(--font-mono);font-size:0.7rem;color:var(--mgray)}

  /* ─ JAPA COUNTER ─ */
  .japa-counter{
    display:flex;flex-direction:column;align-items:center;gap:0.5rem;
    margin:0.8rem 0;
  }
  .japa-num{
    font-family:var(--font-serif);font-size:3.5rem;line-height:1;color:var(--pink);
  }
  .japa-sub{font-family:var(--font-mono);font-size:0.7rem;color:var(--mgray);text-align:center}
  .japa-btns{display:flex;gap:8px;margin-top:0.3rem}
  .japa-btns button{
    font-family:var(--font-mono);font-size:0.75rem;padding:6px 14px;
    border-radius:999px;border:1.5px solid var(--lgray);background:var(--white);cursor:pointer;
    transition:all 0.15s;
  }
  .japa-btns button:hover{background:var(--lpink);border-color:var(--mpink);color:var(--pink)}
  .japa-btns button.inc{background:var(--pink);color:#fff;border-color:var(--pink)}
  .japa-btns button.inc:hover{background:#c41677}
  .japa-progress{
    width:100%;height:6px;background:var(--lgray);border-radius:999px;overflow:hidden;margin-top:4px;
  }
  .japa-fill{height:100%;background:var(--pink);border-radius:999px;transition:width 0.3s}

  /* ─ TASK LIST ─ */
  .task-input-row{display:flex;gap:6px;margin-top:0.7rem}
  .task-input-row input{
    flex:1;padding:7px 10px;border-radius:8px;border:1px solid var(--lgray);
    font-family:var(--font-sans);font-size:0.82rem;outline:none;
  }
  .task-input-row input:focus{border-color:var(--blue)}
  .task-input-row select{
    padding:7px 8px;border-radius:8px;border:1px solid var(--lgray);
    font-family:var(--font-mono);font-size:0.7rem;outline:none;background:var(--white);
  }
  .task-input-row button{
    padding:7px 14px;border-radius:8px;background:var(--black);color:var(--yellow);
    border:none;cursor:pointer;font-family:var(--font-mono);font-size:0.75rem;
    letter-spacing:0.04em;transition:background 0.15s;
  }
  .task-input-row button:hover{background:var(--pink)}

  .task-list{margin-top:0.8rem;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
  .task-item{
    display:flex;align-items:center;gap:8px;
    padding:7px 9px;border-radius:8px;border:1px solid var(--lgray);
    animation:slideIn 0.2s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .task-item.done-task{opacity:0.5}
  .task-item.done-task .task-text{text-decoration:line-through}
  .task-check{
    width:18px;height:18px;border-radius:4px;border:1.5px solid var(--lgray);
    cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;transition:all 0.15s;
  }
  .task-item.done-task .task-check{background:var(--green);border-color:var(--green);color:#fff}
  .task-text{flex:1;font-size:0.82rem}
  .task-cat{
    font-family:var(--font-mono);font-size:0.65rem;padding:2px 7px;
    border-radius:999px;border:1px solid;letter-spacing:0.03em;white-space:nowrap;
  }
  .cat-study{color:#2563eb;border-color:#93c5fd;background:var(--lblue)}
  .cat-sadhana{color:var(--pink);border-color:var(--mpink);background:var(--lpink)}
  .cat-personal{color:#7a6800;border-color:#f5d700;background:var(--ybg)}
  .cat-dev{color:var(--dgray);border-color:var(--lgray);background:var(--silver)}
  .task-del{background:none;border:none;cursor:pointer;color:var(--lgray);font-size:14px;padding:2px;transition:color 0.15s}
  .task-del:hover{color:var(--pink)}

  /* ─ PROGRESS BAR ─ */
  .progress-section{margin-top:0.8rem}
  .prog-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .prog-label{font-size:0.75rem;color:var(--mgray);min-width:70px;font-family:var(--font-mono)}
  .prog-bar{flex:1;height:5px;background:var(--lgray);border-radius:999px;overflow:hidden}
  .prog-fill{height:100%;border-radius:999px;transition:width 0.4s}
  .prog-pct{font-family:var(--font-mono);font-size:0.72rem;color:var(--mgray);min-width:28px;text-align:right}

  /* ─ STREAK ─ */
  .streak-row{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:0.8rem
  }
  .streak-dot{
    width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-family:var(--font-mono);
  }
  .streak-dot.done{background:var(--pink);color:#fff}
  .streak-dot.skip{background:var(--lgray);color:var(--mgray)}
  .streak-dot.today{background:var(--yellow);color:var(--black);font-weight:600}

  /* ─ REFLECTION ─ */
  .reflection-area{
    width:100%;min-height:80px;padding:8px;border:1px solid var(--lgray);border-radius:8px;
    font-family:var(--font-sans);font-size:0.82rem;line-height:1.6;resize:vertical;outline:none;
    margin-top:0.7rem;
  }
  .reflection-area:focus{border-color:var(--pink)}
  .save-btn{
    margin-top:6px;padding:6px 14px;border-radius:999px;background:var(--pink);color:#fff;
    border:none;cursor:pointer;font-family:var(--font-mono);font-size:0.73rem;letter-spacing:0.04em;
    transition:background 0.15s;
  }
  .save-btn:hover{background:#c41677}
  .saved-msg{font-family:var(--font-mono);font-size:0.7rem;color:var(--green);margin-left:8px;opacity:0;transition:opacity 0.3s}
  .saved-msg.show{opacity:1}
</style>
</head>
<body ng-app="sadhanaApp" ng-controller="SadhanaCtrl">

<div class="date-banner">
  <span>⊙ SADHANA + TASK TRACKER</span>
  <span id="today-date"></span>
</div>

<div class="grid">

  <!-- COL 1: SADHANA + JAPA -->
  <div style="display:flex;flex-direction:column;gap:1rem">

    <!-- JAPA COUNTER CARD -->
    <div class="card">
      <div class="mono">📿 Japa Counter</div>
      <div class="japa-counter">
        <div class="japa-num" id="japa-count">0</div>
        <div class="japa-sub">rounds completed · goal: 16</div>
        <div class="japa-progress"><div class="japa-fill" id="japa-bar" style="width:0%"></div></div>
        <div class="japa-btns">
          <button onclick="adjustJapa(-1)">− 1</button>
          <button class="inc" onclick="adjustJapa(1)">+ 1 round</button>
          <button onclick="resetJapa()">reset</button>
        </div>
      </div>
    </div>

    <!-- SADHANA CHECKLIST -->
    <div class="card">
      <div class="mono">☀️ Daily Sadhana</div>
      <div class="sadhana-list" id="sadhana-list"></div>
      <div class="progress-section" style="margin-top:1rem">
        <div class="mono" style="margin-bottom:6px">Today's Progress</div>
        <div class="prog-row">
          <span class="prog-label">Sadhana</span>
          <div class="prog-bar"><div class="prog-fill" id="prog-sadhana" style="width:0%;background:var(--pink)"></div></div>
          <span class="prog-pct" id="pct-sadhana">0%</span>
        </div>
        <div class="prog-row">
          <span class="prog-label">Tasks</span>
          <div class="prog-bar"><div class="prog-fill" id="prog-tasks" style="width:0%;background:var(--blue)"></div></div>
          <span class="prog-pct" id="pct-tasks">0%</span>
        </div>
      </div>
    </div>

    <!-- STREAK -->
    <div class="card">
      <div class="mono">🔥 7-Day Streak</div>
      <div class="streak-row" id="streak-row"></div>
      <p style="font-size:0.75rem;color:var(--mgray);margin-top:8px">Keep going — consistency builds character.</p>
    </div>

  </div>

  <!-- COL 2: TASKS + REFLECTION -->
  <div style="display:flex;flex-direction:column;gap:1rem">

    <!-- TASK LIST -->
    <div class="card">
      <div class="mono">✦ Task List</div>
      <div class="task-input-row">
        <input type="text" id="task-input" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addTask()">
        <select id="task-cat">
          <option value="study">Study</option>
          <option value="sadhana">Sadhana</option>
          <option value="personal">Personal</option>
          <option value="dev">Dev</option>
        </select>
        <button onclick="addTask()">+ Add</button>
      </div>
      <div class="task-list" id="task-list"></div>
    </div>

    <!-- DAILY REFLECTION -->
    <div class="card">
      <div class="mono">📓 Daily Reflection</div>
      <p style="font-size:0.78rem;color:var(--mgray);margin-top:4px">What did you learn, feel, or realise today?</p>
      <textarea class="reflection-area" id="reflection-text" placeholder="Today I realised..."></textarea>
      <div style="display:flex;align-items:center;margin-top:4px">
        <button class="save-btn" onclick="saveReflection()">Save reflection</button>
        <span class="saved-msg" id="saved-msg">✓ Saved</span>
      </div>
    </div>

    <!-- QUOTE OF THE DAY -->
    <div class="card" style="background:var(--black);border-color:var(--black);">
      <div class="mono" style="color:var(--yellow)">☽ Prabhupada Reminder</div>
      <p id="daily-quote" style="font-family:var(--font-serif);font-size:1rem;color:#fff;line-height:1.5;margin-top:0.6rem;font-style:italic"></p>
    </div>

  </div>

</div><!-- end grid -->

<script>
const SADHANA_ITEMS = [
  { id:'japa',    label:'Japa — 16 Rounds',         icon:'📿' },
  { id:'gita',    label:'Bhagavad Gita Reading',    icon:'📖' },
  { id:'puja',    label:'Morning Puja / Prayers',   icon:'🪷' },
  { id:'lecture', label:'Prabhupada Lecture',       icon:'🎙️' },
  { id:'tilak',   label:'Tilak + Devotional dress', icon:'✦' },
  { id:'prasad',  label:'Taking only Prasadam',     icon:'🍛' },
];

const QUOTES = [
  "Chant Hare Krishna and be happy.",
  "The recommended means of self-realization in this age is the chanting of the holy name of God.",
  "A devotee should not be lazy in his spiritual duties.",
  "Read my books regularly and everything will be understood.",
  "The highest perfection of human life is to remember Vishnu at the time of death.",
  "Cleanliness is next to Godliness.",
  "Without devotional service, one cannot achieve the highest perfection.",
];

const KEY_SD = 'sadhana_done';
const KEY_TASKS = 'blog_tasks';
const KEY_JAPA = 'japa_count';
const KEY_REFL = 'blog_reflection';
const KEY_STREAK = 'blog_streak';

let sadhanaState = JSON.parse(localStorage.getItem(KEY_SD) || '{}');
let tasks = JSON.parse(localStorage.getItem(KEY_TASKS) || '[]');
let japaCount = parseInt(localStorage.getItem(KEY_JAPA) || '0');
let streakData = JSON.parse(localStorage.getItem(KEY_STREAK) || '[]');

// ─ DATE ─
const now = new Date();
const dateStr = now.toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
document.getElementById('today-date').textContent = dateStr;

// ─ QUOTE ─
document.getElementById('daily-quote').textContent = '"' + QUOTES[now.getDay() % QUOTES.length] + '"';

// ─ JAPA ─
function renderJapa(){
  document.getElementById('japa-count').textContent = japaCount;
  const pct = Math.min((japaCount/16)*100, 100);
  document.getElementById('japa-bar').style.width = pct + '%';
  localStorage.setItem(KEY_JAPA, japaCount);
  updateProgress();
}
window.adjustJapa = (d) => { japaCount = Math.max(0, japaCount + d); renderJapa(); };
window.resetJapa  = ()  => { japaCount = 0; renderJapa(); };
renderJapa();

// ─ SADHANA LIST ─
function renderSadhana(){
  const list = document.getElementById('sadhana-list');
  list.innerHTML = '';
  SADHANA_ITEMS.forEach(item => {
    const done = !!sadhanaState[item.id];
    const el = document.createElement('div');
    el.className = 'sadhana-item' + (done ? ' done' : '');
    el.innerHTML = `
      <div class="s-check">${done ? '✓' : ''}</div>
      <span style="font-size:1rem">${item.icon}</span>
      <span class="s-label">${item.label}</span>
    `;
    el.addEventListener('click', () => {
      sadhanaState[item.id] = !sadhanaState[item.id];
      localStorage.setItem(KEY_SD, JSON.stringify(sadhanaState));
      renderSadhana();
    });
    list.appendChild(el);
  });
  updateProgress();
}
renderSadhana();

// ─ PROGRESS ─
function updateProgress(){
  const sDone = SADHANA_ITEMS.filter(i => sadhanaState[i.id]).length;
  const sPct = Math.round((sDone / SADHANA_ITEMS.length) * 100);
  document.getElementById('prog-sadhana').style.width = sPct + '%';
  document.getElementById('pct-sadhana').textContent = sPct + '%';

  const tDone = tasks.filter(t => t.done).length;
  const tPct = tasks.length ? Math.round((tDone / tasks.length) * 100) : 0;
  document.getElementById('prog-tasks').style.width = tPct + '%';
  document.getElementById('pct-tasks').textContent = tPct + '%';
}

// ─ STREAK ─
function renderStreak(){
  const row = document.getElementById('streak-row');
  row.innerHTML = '';
  const days = ['S','M','T','W','T','F','S'];
  const todayDow = now.getDay();
  for(let i=6;i>=0;i--){
    const d = new Date(now); d.setDate(now.getDate()-i);
    const key = d.toISOString().split('T')[0];
    const isDone = streakData.includes(key);
    const isToday = i===0;
    const dot = document.createElement('div');
    dot.className = 'streak-dot ' + (isToday ? 'today' : isDone ? 'done' : 'skip');
    dot.title = key;
    dot.textContent = days[d.getDay()];
    row.appendChild(dot);
  }
  const todayKey = now.toISOString().split('T')[0];
  const allDone = SADHANA_ITEMS.every(i => sadhanaState[i.id]);
  if(allDone && !streakData.includes(todayKey)){
    streakData.push(todayKey);
    localStorage.setItem(KEY_STREAK, JSON.stringify(streakData));
    renderStreak();
  }
}
renderStreak();

// ─ TASKS ─
function renderTasks(){
  const list = document.getElementById('task-list');
  list.innerHTML = '';
  tasks.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'task-item' + (t.done ? ' done-task' : '');
    el.innerHTML = `
      <div class="task-check" onclick="toggleTask(${i})">${t.done ? '✓' : ''}</div>
      <span class="task-text">${t.text}</span>
      <span class="task-cat cat-${t.cat}">${t.cat}</span>
      <button class="task-del" onclick="deleteTask(${i})">✕</button>
    `;
    list.appendChild(el);
  });
  saveTasks();
  updateProgress();
}
window.toggleTask = (i) => { tasks[i].done = !tasks[i].done; renderTasks(); };
window.deleteTask = (i) => { tasks.splice(i,1); renderTasks(); };
window.addTask = () => {
  const inp = document.getElementById('task-input');
  const cat = document.getElementById('task-cat').value;
  const text = inp.value.trim();
  if(!text) return;
  tasks.unshift({ text, cat, done: false, ts: Date.now() });
  inp.value = '';
  renderTasks();
};
function saveTasks(){ localStorage.setItem(KEY_TASKS, JSON.stringify(tasks)); }
renderTasks();

// ─ REFLECTION ─
document.getElementById('reflection-text').value = localStorage.getItem(KEY_REFL) || '';
window.saveReflection = () => {
  localStorage.setItem(KEY_REFL, document.getElementById('reflection-text').value);
  const msg = document.getElementById('saved-msg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
};
</script>
</body>
</html>
